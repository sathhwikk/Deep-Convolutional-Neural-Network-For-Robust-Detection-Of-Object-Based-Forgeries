<!DOCTYPE html>

<html lang="en">
{%load static%}

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgery Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <style>
        body {
            background: url('{% static "images/background.jpg" %}') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            font-family: 'Lato', sans-serif;
        }

        .interactiveDiv {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
        }

        .custom-file-label {
            background: white;
            color: black;
        }

        .btn-light {
            background: transparent;
            color: white;
            border: 1px solid white;
        }

        .btn-light:hover {
            background: white;
            color: black;
        }

        video {
            width: 100%;
            max-height: 60vh;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
        }

        .navbar-nav .nav-link {
            color: white !important;
        }

        .navbar-nav .nav-link:hover {
            color: #f8f9fa !important;
            background: #343a40;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="#">Forgery Detection</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/User">User Login</a></li>
                <li class="nav-item"><a class="nav-link" href="/Register">User Registration</a></li>


                
            </ul>
        </div>
    </nav>


    

<section class="newsletter bg-light" 
         style="background: url('{% static "images/background.jpg" %}') no-repeat center center; 
                background-size: cover; 
                min-height: 500px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 py-5 my-5">
                <div class="subscribe-header text-center pb-3">
                    <h3 class="section-title text-uppercase">Login Now</h3>
                </div>
                 <p style="color:white">{{data}}</p>
                <form id="form" class="d-flex flex-wrap gap-2" action="/LogAction" method="post">
                    {%csrf_token%}
                    <input type="text" name="email" placeholder="Your Email" class="form-control form-control-lg">
              
                    <input type="password" name="password" placeholder="Your Password" class="form-control form-control-lg">
                    <p style="color:white;">Doesn't have an account?<a href="/Register" style="color:red;">Register</a></p>
                    <button class="btn btn-dark btn-lg text-uppercase w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
</section>


</body>

</html>
